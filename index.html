<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willco Solutions | Pay at sub-cent cost</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #2563eb;
            --light-bg: #f8fafc;
            --text-color: #334155;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--light-bg);
            color: var(--text-color);
            line-height: 1.6;
        }
        header {
            background: var(--primary-color);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        header p {
            color: #94a3b8;
        }
        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .card h3 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 1rem;
        }
        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        #payment-modal {
            margin-top: 2rem;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            display: none;
        }
        .crypto-details {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 4px;
            word-break: break-all;
            font-family: monospace;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Willco Solutions</h1>
        <p>Secure Checkout Portal — Pay at sub-cent cost</p>
    </header>

    <div class="container">
        <div class="card">
            <h3>Checkout Portal</h3>
            <div class="form-group">
                <label for="quoted-price">Enter Quoted Price (USD):</label>
                <input type="number" id="quoted-price" placeholder="e.g. 150.00" step="0.01" min="0.01">
            </div>
            <div class="form-group">
                <label for="order-desc">Order Description / Reference:</label>
                <input type="text" id="order-desc" placeholder="e.g. Consulting Invoice #1024">
            </div>
            <button class="btn" onclick="startCustomCheckout()">Proceed to Pay at sub-cent cost</button>
        </div>

        <!-- Dynamic Checkout Result Modal -->
        <div id="payment-modal">
            <h3>Payment Instructions</h3>
            <p id="item-description"></p>
            <div class="crypto-details" id="crypto-output">
                Generating payment address...
            </div>
        </div>
    </div>

    <script>
        async function startCustomCheckout() {
            const amountInput = document.getElementById('quoted-price').value;
            const descInput = document.getElementById('order-desc').value || 'Custom Service Invoice';
            
            const amount = parseFloat(amountInput);
            if (!amount || amount <= 0) {
                alert('Please enter a valid quoted price.');
                return;
            }

            const modal = document.getElementById('payment-modal');
            const output = document.getElementById('crypto-output');
            const desc = document.getElementById('item-description');
            
            modal.style.display = 'block';
            desc.innerText = `Description: ${descInput} | Amount: $${amount.toFixed(2)} USD`;
            output.innerText = "Connecting to payment gateway...";

            try {
                // Updated with your live Render backend URL
                const backendUrl = 'https://sub-cent-checkout-backend.onrender.com/create-payment';

                const response = await fetch(backendUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        price_amount: amount,
                        price_currency: 'usd',
                        pay_currency: 'usdttrc20', 
                        order_id: 'WILLCO-' + Math.floor(Math.random() * 100000),
                        order_description: descInput
                    })
                });

                const data = await response.json();

                if (data.pay_address) {
                    output.innerHTML = `
                        <strong>Send exactly:</strong> ${data.pay_amount} ${data.pay_currency.toUpperCase()}<br><br>
                        <strong>To Deposit Address:</strong><br>
                        <span style="color: #2563eb; font-weight: bold;">${data.pay_address}</span><br><br>
                        <em>Status: Waiting for transfer... (IPN will confirm automatically)</em>
                    `;
                } else {
                    output.innerText = "Error generating payment. Please try again later.";
                }
            } catch (error) {
                console.error('Error:', error);
                output.innerText = "Failed to connect to backend payment server.";
            }
        }
    </script>

</body>
</html>
